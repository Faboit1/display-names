# ---------------------------------------------------------------------------
#  DisplayNames  -  multi-line nametags as TextDisplay entities
#  Folia + Paper  |  MiniMessage  |  PlaceholderAPI
# ---------------------------------------------------------------------------
#
#  Every line below is parsed with MiniMessage:
#      <yellow> <#ffffde> <gradient:black:white> <bold> <rainbow> ...
#      https://docs.advntr.dev/minimessage/format.html
#
#  Placeholders (%...%) are resolved with PlaceholderAPI if it is installed.
#  Legacy colour codes coming *out* of a placeholder (LuckPerms prefixes,
#  Vault, ...) are converted to MiniMessage automatically - see
#  `text.legacy-colors` near the bottom.
#
#  Every value in this file is optional. Delete anything you do not care about
#  and the built-in default is used.
# ---------------------------------------------------------------------------

# The default nametag. One list entry = one line.
nametag:
  lines:
    - "<yellow>%luckperms_prefix%<white>%player_name% <#ffffde>%luckperms_suffix%"
    - "<green>%vault_eco_balance%<white>$"

# How often (in TICKS) placeholders are re-evaluated. 20 ticks = 1 second.
# Set to 0 to never auto-refresh (tags then only update on join / world change
# / `/dn refresh`). Higher = cheaper. 10 is a good balance.
refresh-interval: 10

# Where the text sits, in blocks, relative to the player's FEET.
# A player is 1.8 blocks tall, so ~2.2 - 2.6 hovers just above the head.
offset:
  x: 0.0
  y: 2.5
  z: 0.0
  # Where a passenger attaches to a player. Vanilla uses height * 0.75 = 1.35.
  # Only touch this if the tag sits at the wrong height on every player.
  mount-anchor: 1.35

# ---------------------------------------------------------------------------
#  Appearance
# ---------------------------------------------------------------------------
display:

  # How the text turns to face people.
  #   CENTER     - always faces the viewer, both axes (a normal floating name)
  #   VERTICAL   - turns left/right to follow the viewer, never tilts
  #   HORIZONTAL - tilts up/down to follow the viewer, never turns
  #   FIXED      - never moves; points wherever `rotation` says
  billboard: CENTER

  # Which way the text points. This is the ONLY thing that aims a fixed tag -
  # the entity is always spawned facing due south, so a tag never inherits the
  # direction its owner happened to be looking when it was created.
  #
  # Ignored entirely by CENTER, and each of the other modes ignores the axis it
  # follows the viewer on:
  #   VERTICAL   uses pitch and roll (yaw follows the viewer)
  #   HORIZONTAL uses yaw and roll   (pitch follows the viewer)
  #   FIXED      uses all three
  # Angles are degrees.
  rotation:
    # Minecraft's convention: 0 faces south (+Z), 90 faces west, 180 north,
    # 270 east. Increasing yaw turns clockwise seen from above.
    yaw: 0.0
    # Positive tilts the top of the text away from you.
    pitch: 0.0
    # Positive rolls the text clockwise from the reader's point of view.
    roll: 0.0

  # Text size. Either one number for all axes, or a per-axis block:
  #   scale: 1.5
  # or
  #   scale:
  #     x: 1.5
  #     y: 1.5
  #     z: 1.0
  scale: 1.0

  # The panel behind the text.
  background:
    #   CUSTOM - use `color` and `opacity` below
    #   CLIENT - vanilla behaviour: follows each player's own
    #            "Text Background Opacity" video setting
    #   NONE   - no background at all
    mode: NONE
    color: "#000000"
    # 0 = invisible, 255 = solid. Vanilla's own background is 64.
    opacity: 64

  # Opacity of the glyphs themselves. 0-255, where 255 is solid.
  # Anything below about 26 makes the text invisible.
  text-opacity: 255

  # Drop shadow on the glyphs.
  text-shadow: false

  # Render the text through blocks and terrain, so tags stay visible underground
  # and behind walls. Sneaking and invisibility override this - see the
  # `visibility` section below.
  see-through: true

  # LEFT | CENTER | RIGHT
  alignment: CENTER

  # Width in pixels before a line wraps on its own.
  line-width: 200

  # Render distance multiplier. 1.0 = ~64 blocks, 2.0 = ~128 blocks.
  # NOTE: the client multiplies this by its own "Entity Distance" video setting,
  # so a player running that at 50% halves it. 2.0 keeps tags visible for
  # players with low entity distance; lower it if you want less client work.
  view-range: 2.0

  # Light level the text is drawn at, ignoring the world's own lighting.
  # Set `enabled: false` to use world lighting instead (dark tags at night).
  brightness:
    enabled: true
    block: 15   # 0-15
    sky: 15     # 0-15

  # The shadow the entity casts on the ground. Off by default; a nametag
  # floating above someone's head casting a shadow looks odd.
  entity-shadow:
    radius: 0.0
    strength: 1.0

  # Size of the box used to decide the tag is off-screen. 0 = never culled,
  # which stops tall multi-line tags vanishing at the edge of the screen.
  culling:
    width: 0.0
    height: 0.0

  # Outline colour, as #RRGGBB. Setting anything other than "none" also makes
  # the tag glow.
  glow-color: "none"

  # Client-side smoothing. The tag rides the player, so the client already
  # moves it smoothly; these only matter if you are animating a transform.
  interpolation:
    delay: 0
    duration: 0
    teleport-duration: 0   # 0-59

# ---------------------------------------------------------------------------
#  Per-permission formats
# ---------------------------------------------------------------------------
#  The first profile (highest priority) whose permission the player has wins.
#  Players matching nothing get `nametag.lines` above.
#
#  A profile may also override `offset` and any part of `display`. Anything it
#  does not mention is inherited from the global settings above.
#
#  Every profile permission is registered with a default of `false`, so nobody
#  holds one until you grant it - operators included. Grant them in LuckPerms
#  (or whatever you use) the same way you would any other node.
#
#  The examples below are commented out on purpose: until you uncomment one,
#  every player gets `nametag.lines` above and nothing else.
profiles: {}
#profiles:
#  admin:
#    permission: "displaynames.profile.admin"
#    priority: 100
#    lines:
#      - "<gradient:#ff5555:#ffaa00><bold>ADMIN</bold></gradient>"
#      - "<white>%player_name%"
#    display:
#      scale: 1.15
#      glow-color: "#ff5555"
#  donor:
#    permission: "displaynames.profile.donor"
#    priority: 50
#    lines:
#      - "<gradient:#55ffff:#ffffff>%player_name%</gradient>"

# ---------------------------------------------------------------------------
#  When the nametag should be hidden
# ---------------------------------------------------------------------------
visibility:
  # Hide the tag from the player wearing it (it would otherwise float in their
  # own face whenever they look up in first person).
  hide-from-self: true

  # Removing the vanilla username plate.
  #
  # The only way to do this without packet manipulation is a scoreboard team
  # with name-tag-visibility = NEVER. The catch: a team only affects the plates
  # a player sees if it is on the scoreboard THAT PLAYER is currently viewing.
  # Sidebar, tab and scoreboard plugins move players onto their own scoreboards,
  # so DisplayNames sweeps every scoreboard actually in use, and repeats on a
  # timer because those plugins rebuild them constantly.
  hide-vanilla-nametag:
    #   ADOPT - leave existing team membership alone and just switch off
    #           nametag visibility on whatever team a player is already in.
    #           Compatible with tab-list sorting, which is usually driven by
    #           team names. Use this if you run a tab or sidebar plugin.
    #   TEAM  - put every player into our own team. Self-contained, but a
    #           player can only be in one team, so this WILL fight anything
    #           else that uses teams.
    #   NONE  - do nothing; keep vanilla nametags.
    mode: ADOPT

    # Name of the team created for players who are not in one already.
    # Max 16 characters.
    team-name: "displaynames"

    # How often (in ticks) to re-apply. Rank, tab and sidebar plugins rebuild
    # their teams constantly, and every rebuild silently undoes our change - so
    # this has to win the race, not just run occasionally. 20 = every second.
    # Set to 0 to apply once at startup and on join only.
    #
    # If plates still come back, run /dn status: a non-zero "teams adopted" on
    # every sweep means another plugin is actively fighting us, and the console
    # will say so. Switching mode to TEAM ends the fight outright.
    reassert-interval: 20

  # Sneaking and invisibility normally do not hide the tag outright - they drop it
  # back to line-of-sight only, so it stops showing through walls. That is what
  # these two control; set them to true to keep tags see-through even then.
  see-through-while-sneaking: false
  see-through-while-invisible: false

  # Hide the tag ENTIRELY while sneaking / invisible, rather than just taking away
  # see-through. Leave these false to get the behaviour described above.
  hide-while-sneaking: false
  hide-while-invisible: false

  # Hide the tag in spectator mode.
  hide-in-spectator: true

  # Hide the tag for players vanished by Essentials/CMI/SuperVanish
  # (checks the standard "vanished" metadata key).
  hide-while-vanished: true

  # Worlds where DisplayNames does nothing at all, e.g. [ "world_the_end" ].
  disabled-worlds: []

# ---------------------------------------------------------------------------
#  Text handling
# ---------------------------------------------------------------------------
text:
  # Convert legacy colour codes found in the final string into MiniMessage.
  #   NONE      - off (fastest, but LuckPerms prefixes show raw codes)
  #   SECTION   - convert the section sign only - what plugins actually emit
  #   AMPERSAND - convert & codes only
  #   BOTH      - convert both
  legacy-colors: SECTION

# ---------------------------------------------------------------------------
#  Performance
# ---------------------------------------------------------------------------
performance:
  # Skip placeholder evaluation entirely for players that no other player is
  # close enough to see. Nobody is looking, so nothing is recomputed - the
  # single biggest saver on large servers with expensive placeholders
  # (economy lookups, database-backed expansions, ...).
  #
  # Off by default: it is a real saving, but it is also the one setting that can
  # make a tag look wrong (stale for up to one refresh interval) rather than just
  # slow. Turn it on once everything else is behaving.
  skip-updates-without-viewers: false

  # Grid resolution used by the check above, in blocks. Raised automatically if
  # it is smaller than your widest `view-range`. Bigger = cheaper but skips
  # less often.
  viewer-grid-size: 128

  # Cache parsed MiniMessage components, keyed by the resolved string, so
  # players sharing a rank share one parse. 0 disables.
  component-cache-size: 512

  # Spread each player's refresh over the interval instead of updating
  # everyone on the same tick. Leave enabled.
  stagger-updates: true
